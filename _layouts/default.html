<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <!-- РОДНАЯ СЕТКА MINIMAL -->
    <div class="container-lg px-3 my-5 markdown-body">
      <div class="d-flex flex-column flex-md-row">
        
        <!-- ЛЕВАЯ КОЛОНКА (ШАПКА + ФУТЕР) -->
        <div class="flex-shrink-0 mr-3 mb-4 mb-md-0" style="width: 220px;">
          <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
          <p>{{ site.description }}</p>
          
          <!-- ССЫЛКА НА GITHUB УДАЛЕНА ЦЕЛИКОМ -->
          
          <!-- КАСТОМНЫЙ ФУТЕР В ЛЕВОЙ КОЛОНКЕ -->
          <footer style="margin-top: 3rem; font-size: 0.85em; color: #6a737d;">
            <p>© 2026 Андрей Вечер</p>
            <p>Честность важнее красоты.</p>
          </footer>
        </div>

        <!-- ПРАВАЯ КОЛОНКА (КОНТЕНТ) -->
        <div class="flex-grow-1 ml-md-3">
          {{ content }}
        </div>
        
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js"></script>
    <script>anchors.add();</script>
  </body>
</html>
