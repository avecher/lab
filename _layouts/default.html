<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <style>
      /* Базовые стили для сетки */
      .site-layout { display: flex; flex-direction: column; }
      
      @media (min-width: 768px) {
        .site-layout { 
          flex-direction: row; 
          align-items: flex-start; /* Важно: предотвращает растягивание колонок по высоте */
        }
        .site-sidebar { 
          width: 220px; 
          flex-shrink: 0; 
          margin-right: 3rem; 
        }
        .site-content { 
          flex-grow: 1; 
          max-width: 900px; /* Ограничение ширины для читаемости */
        }
        /* На десктопе футер остается в сайдбаре */
        .mobile-footer { display: none !important; }
      }

      @media (max-width: 767px) {
        /* На мобильных скрываем футер в сайдбаре */
        .desktop-footer { display: none !important; }
        
        /* Добавляем отступы для мобильного контента */
        .markdown-body { padding-left: 1.5rem !important; padding-right: 1.5rem !important; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body site-layout">
      
      <!-- ЛЕВАЯ КОЛОНКА / ШАПКА -->
      <div class="site-sidebar">
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        
        <!-- ФУТЕР ТОЛЬКО ДЛЯ ДЕСКТОПА -->
        <footer class="desktop-footer" style="margin-top: 4rem; font-size: 0.85em; color: #6a737d;">
          <p>© 2026 Режиссёрская трансмедиа лаборатория Андрея Вечера.</p>
          <p>Честность важнее красоты. Процесс важнее результата.</p>
        </footer>
      </div>

      <!-- ПРАВАЯ КОЛОНКА / КОНТЕНТ -->
      <div class="site-content">
        {{ content }}
        
        <!-- ФУТЕР ТОЛЬКО ДЛЯ МОБИЛЬНЫХ (всегда после контента) -->
        <footer class="mobile-footer" style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid #eaecef; font-size: 0.85em; color: #6a737d;">
          <p>© 2026 Режиссёрская трансмедиа лаборатория Андрея Вечера.</p>
          <p>Честность важнее красоты. Процесс важнее результата.</p>
        </footer>
      </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js"></script>
    <script>anchors.add();</script>
  </body>
</html>
