<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    
    <!-- ДОБАВЛЯЕМ МИНИМАЛЬНЫЙ CSS ДЛЯ СЕТКИ, ЕСЛИ ТЕМА НЕ ПОДХВАТЫВАЕТ -->
    <style>
      .site-layout { display: flex; flex-direction: column; }
      @media (min-width: 768px) {
        .site-layout { flex-direction: row; }
        .site-sidebar { width: 220px; flex-shrink: 0; margin-right: 3rem; }
        .site-content { flex-grow: 1; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body site-layout">
      
      <!-- ЛЕВАЯ КОЛОНКА -->
      <div class="site-sidebar">
        <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        
        <footer style="margin-top: 4rem; font-size: 0.85em; color: #6a737d;">
          <p>© Андрей Вечер.2026</p>
          <p>Процесс важнее результата.</p>
        </footer>
      </div>

      <!-- ПРАВАЯ КОЛОНКА -->
      <div class="site-content">
        {{ content }}
      </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js"></script>
    <script>anchors.add();</script>
  </body>
</html>
